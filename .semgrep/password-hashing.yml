# Password-hashing confinement backstop (PR2-SEC-02 residual, D-ARCH-042, ADR-0006 am. 16). ESLint
# (no-restricted-imports + boundaries) catches the static forms; these rules catch the aliased, indirect and dynamic
# forms ESLint cannot follow (R2.4 table). Lane A runs them from the BASE ref with --disable-nosem, so a PR can neither
# weaken them nor suppress them inline. Fixtures: tests/fixtures/semgrep/password-hashing.ts (semgrep --test).
rules:
  - id: platform.password-hashing.bcrypt-outside-hasher
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      [PR2-SEC-02 / D-ARCH-042] '$M' (bcrypt family) is loaded outside the PasswordHasher implementation
      (apps/api/src/modules/identity/service/bcrypt-password-hasher.ts). Use the PasswordHasher port.
    # Every code path that can ship or run in a pipeline. Test files are out of scope: they assert on the string 'bcrypt'
    # and tools/deps/ignore-scripts.test.ts loads the native module on purpose to prove the rebuild (ADR-0023 am. F).
    paths:
      include:
        - /apps/
        - /packages/
        - /prisma/
        - /tools/
      exclude:
        - /apps/api/src/modules/identity/service/bcrypt-password-hasher.ts
        - '*.test.ts'
        - '*.test.tsx'
        - fixtures/
    patterns:
      - pattern-either:
          - pattern: import "$M"
          - pattern: import $X from "$M"
          - pattern: import * as $X from "$M"
          - pattern: import { $...X } from "$M"
          - pattern: export * from "$M"
          - pattern: export { $...X } from "$M"
          - pattern: import("$M")
          - pattern: require("$M")
          # $R("…") under any binding name: `const $R = createRequire(…)`, an aliased `import { createRequire as $C }`.
          - pattern: $R("$M")
          # $X.createRequire(…)("…") and createRequire(…)("…").
          - pattern: $F(...)("$M")
          # Module._load("…"), module.require("…").
          - pattern: $O.$F("$M", ...)
          # $O["require"]("…").
          - pattern: $O[$K]("$M", ...)
          # require.call(…) / require.apply(…).
          - pattern: $F.call($T, "$M", ...)
          - pattern: $F.apply($T, ["$M", ...])
      - metavariable-regex:
          metavariable: $M
          regex: ^['"`]?(@[^/]+/)?bcrypt[-.\w]*(/.*)?['"`]?$

  - id: platform.password-hashing.dynamic-module-load
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      [PR2-SEC-02 / D-ARCH-042] Application code loads a module through a computed specifier or a loader indirection
      (non-literal import()/require(), createRequire loaders, require.call/apply, $O["require"], Module._load). Import
      modules statically so the confinement rules can see them.
    paths:
      include:
        - /apps/*/src/
      exclude:
        - '*.test.ts'
        - '*.test.tsx'
    patterns:
      - pattern-either:
          - pattern: import($E)
          - pattern: require($E)
          - pattern: createRequire(...)($E)
          - pattern: $X.createRequire(...)($E)
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $R = createRequire(...);
                      ...
                  - pattern-inside: |
                      $R = $X.createRequire(...);
                      ...
                  - pattern-inside: |
                      import { createRequire as $C } from "$MOD";
                      ...
                      $R = $C(...);
                      ...
              - pattern: $R($E)
          - pattern: require.call(...)
          - pattern: require.apply(...)
          - pattern: $O["require"](...)
          - pattern: $O._load(...)
      - pattern-not: import("...")
      - pattern-not: require("...")
      - pattern-not: createRequire(...)("...")
      - pattern-not: $X.createRequire(...)("...")
      - pattern-not: $R("...")

  - id: platform.password-hashing.hasher-reexports-bcrypt
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      [PR2-SEC-02 H5/H6 / D-ARCH-042] The PasswordHasher implementation may use the bcrypt family but never re-exports
      it ('$M'); export only the PasswordHasher port.
    paths:
      include:
        - /apps/api/src/modules/identity/service/bcrypt-password-hasher.ts
    patterns:
      - pattern-either:
          - pattern: export * from "$M"
          - pattern: export { $...X } from "$M"
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      import $X from "$M";
                      ...
                  - pattern-inside: |
                      import * as $X from "$M";
                      ...
                  - pattern-inside: |
                      import { $X } from "$M";
                      ...
                  - pattern-inside: |
                      import { $Y as $X } from "$M";
                      ...
                  - pattern-inside: |
                      $X = require("$M");
                      ...
              - pattern-either:
                  - pattern: export { $X }
                  - pattern: export { $X as $Z }
                  - pattern: export default $X
                  - pattern: export const $Z = $X
                  - pattern: module.exports = $X
                  - pattern: module.exports.$P = $X
                  - pattern: exports.$P = $X
      - metavariable-regex:
          metavariable: $M
          regex: ^['"`]?(@[^/]+/)?bcrypt[-.\w]*(/.*)?['"`]?$
