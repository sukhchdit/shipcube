# Fingerprint: c33e5e927f903847daf59ca5f2aa5440562401ef:docs/sdlc/DECISIONS.md:generic-api-key:7697.
[[allowlists]]
description = "PR080-SEC-07 TASK-044 merge c33e5e9 D-ORCH-147 triage line"
condition = "AND"
targetRules = ['''generic-api-key''']
commits = ['''c33e5e927f903847daf59ca5f2aa5440562401ef''']
regexTarget = "line"
paths = ['''^docs/sdlc/DECISIONS\.md$''']
regexes = ['''^\n?  - \*\*Triage \(orchestrator, code review L-2\):\*\* `gitleaks-full` was run on `203d02eb`\. The one finding is `generic-api-key` at `prisma/tests/catalog/tenant-keys\.ts:75` in TASK-051's own commit `b34f954e`\. That line is a doc comment, "The other key columns, `[a-z=]{12}` in key order"\. It is a false positive with no secret\.$''']

