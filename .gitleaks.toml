# Gitleaks configuration (US-048, REQ-SEC-013; TASK-007). Lane A scans only the PR commit range with this file, read
# from the BASE ref when the base has it (a PR cannot widen its own allowlist). Default rules stay on.
#
# There is deliberately no allowlist for docs/03-architecture/api/openapi.yaml: its example credentials are obviously
# fake `EXAMPLE_...` markers (PR10-SEC-08), so a secret-shaped value pasted into the contract fails like anywhere else.
#
# Allowlists are narrow by construction: every entry is scoped to named paths AND a line pattern (condition = "AND"),
# so a real secret pasted elsewhere in the same file, or anywhere else, still fails. Checked by
# tools/ci/sec-static.test.ts (AT-US-048-04).
#
# Pushed-commit false positives (D-ORCH-068): lane A never reads the PR25-SEC-01 fingerprint baseline
# (tools/quality/gitleaks-baseline.txt), and history is never rewritten, so a false positive in a commit that was already
# pushed to a PR gets one entry here that is bound to that exact commit (full 40-hex SHA), that exact path, that one rule
# (targetRules) AND anchored full-line patterns for the flagged lines. The same text in any other commit or path, other
# lines of the same commit, and every other rule are still reported. Never a commit-only, path-only or rule-only entry.
# Gitleaks (v8.30.1, git mode) hands a line target to the allowlist with the preceding newline included, so a full-line
# pattern is written `^\n?<exact line>$` (a bare `^<line>$` never matches; verified with the pinned image).
# Checked by tools/ci/sec-static.test.ts (D-ORCH-068).
title = "shipqube gitleaks"

[extend]
useDefault = true

# PR1-SEC-11: agent documentation describing password hashing ("Argon2id/bcrypt for passwords"), not a credential.
[[allowlists]]
description = "PR1-SEC-11 agent docs prose"
condition = "AND"
regexTarget = "line"
paths = ['''^\.claude/agents/security-analyst\.md$''', '''^claude-code-sdlc-agent-team\.md$''']
regexes = ['''Argon2id/bcrypt for passwords''']

# D-ORCH-068 (PR #39, TASK-014): commit dd7a2dd, a code comment at lines 272-273 naming two public module symbol-key
# constants of the `effect` library (namespaced "effect/..." strings, not credentials; nothing to rotate). The
# follow-up commit removes the values from the comment; the pushed commit stays in the PR range (no history rewrite).
# Fingerprints: dd7a2ddcad30ba422152300f21d7df5f105d283e:tools/docker/scan-image-secrets.mjs:generic-api-key:272 and :273.
[[allowlists]]
description = "D-ORCH-068 PR #39 dd7a2dd effect symbol-key comment"
condition = "AND"
targetRules = ['''generic-api-key''']
commits = ['''dd7a2ddcad30ba422152300f21d7df5f105d283e''']
regexTarget = "line"
paths = ['''^tools/docker/scan-image-secrets\.mjs$''']
regexes = ['''^\n?  // effect 3\.20\.0 \(a dependency of @prisma/config\): `IntervalSymbolKey = "effect/[A-Za-z]{1,32}"` and$''', '''^\n?  // `IntervalsSymbolKey = "effect/[A-Za-z]{1,32}"`, in the cjs, esm and src copies\.$''']

# PR080-SEC-07 route (c) under D-SEC-PR45-01 (D-DEVOPS-003): three branch merge commits re-add main's D-ORCH-147
# triage bullet (docs/sdlc/DECISIONS.md line 7697, added on main by d7585e78, reworded on main by 1a2b9d7d). It quotes a
# doc-comment phrase (12 characters, lower-case letters and "=" only), not a credential: nothing to rotate. Each merge's
# first-parent diff adds the line again (same content hash in all four commits), and lane A's range scan holds the
# merge. One table per commit: that commit, that path, that rule and the one anchored line, whose quoted phrase is
# limited to its character class and length (the value is never quoted). Main's own fingerprints (d7585e78, ed156913)
# are never in a PR range (base..head excludes main's ancestry); they stay in the gitleaks-full baseline (route (b)).

