# Dependabot (TASK-007; ADR-0023 am. F item 2, PR1-SEC-12 item 4, D-ARCH-010 item 6).
# - 7-day cooldown on every ecosystem (the same release age the lane A cooldown gate and .npmrc min-release-age use).
# - Monthly, grouped and few open PRs: each Dependabot PR costs a lane A run against the hosted-minutes budget. The npm
#   group holds at most ONE open PR (D-ORCH-078 P3, ruling wave-0-ci-minutes.md section 6): merge it or `@dependabot ignore`
#   rather than close it, because a closed group PR is recreated at the next check.
# - @platform/* are our private workspace packages; the scope on npmjs.com belongs to a third party and .npmrc pins it
#   to registry.invalid, so Dependabot must never look them up (check the first run for private_source_not_reachable).
# - typescript semver-major is ignored: ADR-0001 pins TypeScript ~6.0.3 and defers TypeScript 7 (tsgo) until the Jest/ESLint
#   toolchain peers allow it. Moving to 7 is a reviewed task PR with its own superseding ADR, not an automated bump. Minor and
#   patch updates still flow through the npm-minor-and-patch group. Other majors stay visible for review on purpose.
# - docker (every image Dockerfile) and docker-compose (compose*.yaml) since TASK-014 (PR #39 R2, PR39-SEC-06); the
#   terraform ecosystem is added with the first infra code (TASK-017).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: '@platform/*'
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci(deps)'

  # Base images of the Dockerfiles (TASK-014; PR #39 R2, PR39-SEC-06). D-ARCH-116 rule 3: the node:<version>-<codename>-slim
  # build base and the debian:<codename>-slim runtime base must move together (check-dockerfiles rule runtime-codename),
  # so ONE group with patterns ['*'] proposes the node and debian pin bumps of D-TASK014-02 in a single PR.
  # Confirm on the first run that a digest-only bump of debian:trixie-slim (same tag, new digest) is proposed. Fallback
  # if it is not: a monthly lane B 'docker buildx imagetools inspect' digest comparison (follow-up, not built here).
  - package-ecosystem: docker
    directories: ['/apps/api', '/apps/worker', '/apps/web', '/apps/admin', '/prisma']
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    # node semver-major is ignored (D-DEVOPS-002): ADR-0001 and D-ARCH-001 fix Node 24 LTS, and package.json engines
    # (">=24.2 <25") with engine-strict reject any other major in the image npm ci stages. #50 moved all five Dockerfiles
    # to node:26 and was reverted. Node 26 is a reviewed task PR with a superseding ADR (engines, .node-version, CI and
    # images together), not an automated bump. 24.x minor and patch bumps still come, in the same docker-images group
    # as the debian:trixie-slim runtime base, so node and debian still move together (D-ARCH-116 rule 3).
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    groups:
      docker-images:
        patterns: ['*']
    commit-message:
      prefix: 'build(deps)'

  # Service images pinned in compose*.yaml (postgres, valkey, rustfs, aws-cli, mailpit): one grouped PR per month.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    # valkey/valkey semver-major is ignored (D-SECPOST-01 O-1, D-DEVOPS-001): ADR-0001 fixes Valkey 8 and compose.yaml
    # carries the Testcontainers harness digest (tools/quality/suite-runners.json; compose-stack.test.ts), which
    # Dependabot does not edit. #49 moved compose alone to 9.1 and turned main red. Valkey 9 is a reviewed task PR with
    # a superseding ADR (harness and compose together), not an automated bump. 8.x minor and patch bumps still come and
    # must move the harness pin in the same PR.
    ignore:
      - dependency-name: valkey/valkey
        update-types: ['version-update:semver-major']
    groups:
      compose-images:
        patterns: ['*']
    commit-message:
      prefix: 'build(deps)'
