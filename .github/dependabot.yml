# Dependabot (TASK-007; ADR-0023 am. F item 2, PR1-SEC-12 item 4, D-ARCH-010 item 6).
# - 7-day cooldown on every ecosystem (the same release age the lane A cooldown gate and .npmrc min-release-age use).
# - Monthly, grouped and few open PRs: each Dependabot PR costs a lane A run against the hosted-minutes budget.
# - @platform/* are our private workspace packages; the scope on npmjs.com belongs to a third party and .npmrc pins it
#   to registry.invalid, so Dependabot must never look them up (check the first run for private_source_not_reachable).
# - typescript semver-major is ignored: ADR-0001 pins TypeScript ~6.0.3 and defers TypeScript 7 (tsgo) until the Jest/ESLint
#   toolchain peers allow it. Moving to 7 is a reviewed task PR with its own superseding ADR, not an automated bump. Minor and
#   patch updates still flow through the npm-minor-and-patch group. Other majors stay visible for review on purpose.
# - docker (every image Dockerfile) and docker-compose (compose*.yaml) since TASK-014 (PR #39 R2, PR39-SEC-06); the
#   terraform ecosystem is added with the first infra code (TASK-017).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: '@platform/*'
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci(deps)'

  # Base images of the Dockerfiles (TASK-014; PR #39 R2, PR39-SEC-06). D-ARCH-116 rule 3: the node:<version>-<codename>-slim
  # build base and the debian:<codename>-slim runtime base must move together (check-dockerfiles rule runtime-codename),
  # so ONE group with patterns ['*'] proposes the node and debian pin bumps of D-TASK014-02 in a single PR.
  # Confirm on the first run that a digest-only bump of debian:trixie-slim (same tag, new digest) is proposed. Fallback
  # if it is not: a monthly lane B 'docker buildx imagetools inspect' digest comparison (follow-up, not built here).
  - package-ecosystem: docker
    directories: ['/apps/api', '/apps/worker', '/apps/web', '/apps/admin', '/prisma']
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      docker-images:
        patterns: ['*']
    commit-message:
      prefix: 'build(deps)'

  # Service images pinned in compose*.yaml (postgres, valkey, rustfs, aws-cli, mailpit): one grouped PR per month.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      compose-images:
        patterns: ['*']
    commit-message:
      prefix: 'build(deps)'
