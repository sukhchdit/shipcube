# Lane A: hosted PR fast lane (ADR-0023 amendments A, F, I, J, L; D-ARCH-010; TASK-007; stage 2: TASK-286).
#
# - Runs on non-draft pull requests into main, and on pushes to main only when the repository variable
#   CI_MAIN_FAST_LANE is 'true' (D-ARCH-010 item 4). No schedule; lane C (integration, images, e2e, iac, inventory) is
#   workflow_dispatch-only and lives in lane-c.yml (TASK-015 part 015-B; this file's triggers stay pull_request + push,
#   CI_TRIGGERS).
#   Nothing here deploys, pushes images, publishes packages or runs terraform.
# - Jobs (stage 2, D-ARCH-128): fast-lane (tested-base gate tooling, classification and proof lookup, base-ref gates,
#   install, tests, build); security-integration (Testcontainers suites on Linux) after fast-lane, once per code tree on
#   merge-candidate heads that change a security-critical path (ADR-0023 am. G item 5, am. L item 2); ci-gate last:
#   the isolated scans (gitleaks, Semgrep, oasdiff, security record) folded in, the classification recomputed and
#   compared with fast-lane's, merge-readiness decided. ci-gate runs no npm and no head script, so code that fast-lane
#   executes from the PR (deps:rebuild, lint, tests, build) cannot tamper with it (PR10-SEC-02).
# - Lane A is scoped by the PUSH (ADR-0023 am. L item 1, D-ARCH-126): a docs-only push runs fast-lane in light mode
#   (the env.CODE steps are skipped) and inherits them from a proof run on a code-identical commit that tested the same
#   base (PR46-SEC-16); ci-gate re-reads the proof through the jobs API (step conclusions, never a job colour) with the
#   tested base's tools/ci/lane-scope.mjs and is red when fast-lane's classification differs (PR46-SEC-12).
# - Gating is procedural (D-ORCH-012/013, review m6): this private repository's plan has no branch protection or
#   rulesets, so no check can be "required". The orchestrator merges only with
#   `gh pr merge <n> --squash --match-head-commit <sha> --subject "<linted subject>"` after ci-gate concluded `success`
#   (not skipped) for that exact SHA and the security record names it. A draft PR gets a red ci-gate, never a skipped one.
# - No secrets: GITHUB_TOKEN (read-only) is the only credential (ADR-0023 amendment H). It reaches a step only as
#   GH_TOKEN on the lane-scope steps (fast-lane's classify step, before any head code, and ci-gate's lane-scope and
#   aggregation steps), with actions: read and pull-requests: read for the jobs API and the proof binding (policy rules
#   gh-token and permissions; PR46-SEC-15).
# - Gate tooling (tools/ci, tools/quality, .semgrep, .gitleaks.toml, .semgrepignore, .gitignore, the lint fixture
#   harness, the security-integration manifests) runs from the TESTED BASE: on pull requests the first parent of
#   GitHub's test merge (TOOLS_REF = HEAD^1, the current main; PR46-SEC-17), on a push the pushed range's base
#   (SEC-P3-31). A checker the tested base does not have yet is bootstrapped from the head's git objects and the job
#   summary says so. A checker's CLI therefore changes in two steps: first accept the new argument, then use it.
# - Every action is pinned by commit SHA and every container tool by image digest; tools/ci/check-workflow-policy.mjs
#   enforces this file's rules for every workflow, and CI_REQUIRED_GATES_STAGE_2 keeps the gate steps below in place.
name: ci

on:
  # Pull requests into main only (code review PR #46 R2-M1, PR46-SEC-13; base-ref policy pin CI_PULL_REQUEST_BRANCHES): a
  # run against another base executes that base's workflow and tooling, so it must never exist as a proof run. The
  # base-ref lane-scope.mjs binds proofs to this PR into main as well (an attacker-controlled base can drop this filter).
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    # Mirrors the docs-only classifier below: a push of docs/agent notes alone does not start the lane.
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'

permissions:
  contents: read

# Pull requests share one group per PR and queue (D-ARCH-126, RR-7): GitHub keeps one pending run and supersedes it on
# the next push, but never cancels a running one, because a cancelled full run would leave a later docs push without a
# code proof. Pushes to main get one group per commit and are never cancelled: every pushed range must be gitleaks- and
# commitlint-scanned (review m5 (b)).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

env:
  # D-ARCH-044 / ADR-0023 am. J item 5: required at workflow level in every workflow.
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'
  CHECKPOINT_DISABLE: '1'
  SCARF_ANALYTICS: 'false'
  # Container tools, by digest (tag kept for readability; the digest wins).
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  ACTIONLINT_IMAGE: docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
  # oasdiff v1.35.0, Apache-2.0, released 2026-10-28 (7-day cooldown); same value as OASDIFF_IMAGE in tools/ci/openapi-breaking.mjs.
  OASDIFF_IMAGE: docker.io/tufin/oasdiff:v1.35.0@sha256:82b1840a77335562bb11ce95f77ad31745a0c6f3a770929333ed1c5ef466e400

jobs:
  fast-lane:
    name: fast-lane
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'push' && vars.CI_MAIN_FAST_LANE == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # actions: read and pull-requests: read for the proof lookup of the classify step, which alone receives the token
    # and runs before any head code (D-ARCH-128; policy rules gh-token and permissions, PR46-SEC-15).
    permissions:
      contents: read
      actions: read
      pull-requests: read
    # The classify step's outputs (D-ARCH-126/127): mode, the proof and the security-integration selection feed
    # security-integration's if:, tools_ref its manifests; ci-gate recomputes the whole classification and is red on any
    # difference (PR46-SEC-12).
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      code_proof: ${{ steps.classify.outputs.code_proof }}
      security_integration_due: ${{ steps.classify.outputs.security_integration_due }}
      tools_ref: ${{ steps.classify.outputs.tools_ref }}
      classification: ${{ steps.classify.outputs.classification }}
    env:
      # PR1-SEC-03 (c): job level as well, so an out-of-graph nested install inherits it.
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
      RANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      RANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout (full history for the base ref and the PR commit range)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node from .node-version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      # PR46-SEC-17 / PR46-SEC-12 (pinned line by line, FAST_LANE_TOOLING_SCRIPT_V2): the checkout must be the event commit
      # GITHUB_SHA (PR59-SEC-01, TASK-287); on pull requests the tested base is TOOLS_REF = HEAD^1, the first parent of
      # GitHub's test merge (HEAD^2 must be the PR head and RANGE_BASE an ancestor of TOOLS_REF, else fail closed); on a
      # push it is the pushed range's base. Every GATE_* location below comes only
      # from this step; a tool the tested base lacks is extracted from the head's git objects, never the working tree.
      - name: Gate tooling from the tested base (SEC-P3-31, PR46-SEC-17)
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error title=Tested base::the checkout is not the event commit GITHUB_SHA (fail closed, PR59-SEC-01)"
            exit 1
          fi
          tools_ref=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            tools_ref=$(git rev-parse --verify --quiet "HEAD^1^{commit}" || true)
            merged=$(git rev-parse --verify --quiet "HEAD^2^{commit}" || true)
            if [ -z "$tools_ref" ] || [ "$merged" != "$RANGE_HEAD" ] || ! git merge-base --is-ancestor "$RANGE_BASE" "$tools_ref"; then
              echo "::error title=Tested base::the checkout is not the test merge of the PR head into a descendant of its base (fail closed, PR46-SEC-17)"
              exit 1
            fi
          elif [ -n "$RANGE_BASE" ] && [ "$RANGE_BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$RANGE_BASE^{commit}" 2>/dev/null; then
            tools_ref="$RANGE_BASE"
          fi
          base_dir="$RUNNER_TEMP/base"
          head_dir="$RUNNER_TEMP/head"
          mkdir -p "$base_dir" "$head_dir"
          for path in tools/ci .github/CODEOWNERS; do
            if [ -n "$tools_ref" ] && git cat-file -e "$tools_ref:$path" 2>/dev/null; then
              git archive "$tools_ref" "$path" | tar -x -C "$base_dir"
            fi
          done
          if git cat-file -e "$RANGE_HEAD:tools/ci" 2>/dev/null; then
            git archive "$RANGE_HEAD" tools/ci | tar -x -C "$head_dir"
          fi
          {
            echo "## Lane A (fast lane)"
            echo
            echo "Range \`${RANGE_BASE:0:7}..${RANGE_HEAD:0:7}\`, tested base \`${tools_ref:0:7}\`."
            echo
            echo "| Gate tool | Runs from |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for tool in check-workflow-policy check-install-flags check-migration-immutability check-lockfile check-dep-age licence-check check-audit check-porcelain lane-scope; do
            var="GATE_$(echo "$tool" | tr 'a-z-' 'A-Z_')"
            if [ -f "$base_dir/tools/ci/$tool.mjs" ]; then
              echo "$var=$base_dir/tools/ci/$tool.mjs" >> "$GITHUB_ENV"
              echo "| \`$tool\` | tested base |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$var=$head_dir/tools/ci/$tool.mjs" >> "$GITHUB_ENV"
              echo "| \`$tool\` | head (bootstrap: not on the tested base yet) |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "TOOLS_REF=$tools_ref" >> "$GITHUB_ENV"

      # D-ARCH-126/127/128 (RR-3, RR-4), pinned exactly: the tested base's lane-scope.mjs classifies the PUSH range, reads
      # the code and security proofs through the jobs API bound to this PR into main (HEAD_REF and PR_NUMBER are env
      # values, never interpolated into run:) and voids a proof that tested an older base on a lane A input (PR46-SEC-16).
      # It writes CODE and LINT_CONTROLS to $GITHUB_ENV (a light run skips every env.CODE step below and inherits it from
      # the proof run) and the classification to $GITHUB_OUTPUT. The token reaches this step only, before any head code
      # runs; head code that later rewrites CODE through $GITHUB_ENV turns skipped steps into a red ci-gate (rule (b)
      # reads step conclusions), and ci-gate recomputes the classification (rule (g)).
      - name: Classify changed paths and look up proofs (D-ARCH-126/127)
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          RANGE_BEFORE: ${{ github.event.before }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node "${GATE_LANE_SCOPE:?}" --root "$GITHUB_WORKSPACE" --base "$RANGE_BASE" --head "$RANGE_HEAD" --before "$RANGE_BEFORE" --event "$GITHUB_EVENT_NAME" --pr "$PR_NUMBER" --head-ref "$HEAD_REF" --tools-ref "$TOOLS_REF" --lookup --env "$GITHUB_ENV" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      - name: Workflow policy
        run: node "${GATE_CHECK_WORKFLOW_POLICY:?}" --root "$GITHUB_WORKSPACE" --summary "$GITHUB_STEP_SUMMARY"

      - name: Install flags (check-install-flags with check-no-npx and check-no-raw-prisma)
        run: node "${GATE_CHECK_INSTALL_FLAGS:?}" --root "$GITHUB_WORKSPACE" --summary "$GITHUB_STEP_SUMMARY"

      - name: Released migrations are immutable (PR8-SEC-01)
        run: node "${GATE_CHECK_MIGRATION_IMMUTABILITY:?}" --root "$GITHUB_WORKSPACE" --base "$RANGE_BASE" --head "$RANGE_HEAD" --summary "$GITHUB_STEP_SUMMARY"

      - name: Lockfile provenance and delta
        if: env.CODE == 'true'
        run: node "${GATE_CHECK_LOCKFILE:?}" --root "$GITHUB_WORKSPACE" --base "$RANGE_BASE" --summary "$GITHUB_STEP_SUMMARY"

      - name: Release cooldown and freshness
        if: env.CODE == 'true'
        run: |
          set -euo pipefail
          node "${GATE_CHECK_DEP_AGE:?}" --fetch --out "$RUNNER_TEMP/registry-times.json" --root "$GITHUB_WORKSPACE" --base "$RANGE_BASE"
          node "${GATE_CHECK_DEP_AGE:?}" --times "$RUNNER_TEMP/registry-times.json" --root "$GITHUB_WORKSPACE" --base "$RANGE_BASE" --summary "$GITHUB_STEP_SUMMARY"

      # Unconditional, pinned so by the policy (D-TASK286-03, PR #55 R1-n5): the base-ref evidence verifier loads the locked
      # Ajv from node_modules, and signatures and the advisory audit read the installed tree on every push (PR46-SEC-11).
      - name: Install (npm ci --ignore-scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Licences, signatures and advisories read node_modules and the lockfile only, so they run before any lifecycle or
      # head code (deps:rebuild, lint, tests) can touch the runner (PR10-SEC-02 item 2). Signatures and the advisory audit
      # run on every push, a light one too (PR46-SEC-11): an advisory published after the proof run is seen before the
      # merge, on the exact head.
      - name: Licences
        if: env.CODE == 'true'
        run: node "${GATE_LICENCE_CHECK:?}" --root "$GITHUB_WORKSPACE" --summary "$GITHUB_STEP_SUMMARY"

      - name: Registry signatures and provenance (PR1-SEC-12)
        run: npm audit signatures --@platform:registry=https://registry.npmjs.org/

      - name: Vulnerability audit (npm audit + osv-scanner)
        run: |
          # Both scanners exit non-zero when they report anything; check-audit is the gate and fails on missing or
          # error JSON, so their exit codes are recorded rather than acted on here.
          set +e
          npm audit --json > "$RUNNER_TEMP/npm-audit.json"
          echo "npm audit exit $? (evaluated by check-audit)"
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" "$OSV_SCANNER_IMAGE" scan source --lockfile /src/package-lock.json --format json > "$RUNNER_TEMP/osv.json"
          echo "osv-scanner exit $? (evaluated by check-audit)"
          set -e
          node "${GATE_CHECK_AUDIT:?}" --root "$GITHUB_WORKSPACE" --npm-audit "$RUNNER_TEMP/npm-audit.json" --osv "$RUNNER_TEMP/osv.json" --summary "$GITHUB_STEP_SUMMARY"

      # TEST-STRATEGY section 9.2, ADR-0023 am. B/G (SEC-P3-07, SEC-P3-31, SEC-TC-48): the verifier, its lib, schema and
      # the required-suite manifest come from the tested base (TOOLS_REF, PR46-SEC-17; the step env takes it from the
      # classify step's output, which no later step can rewrite); evidence is read from the head commit's git objects
      # and the changed paths from RANGE_BASE...RANGE_HEAD. It runs before any head code except the locked Ajv in
      # node_modules (PR23-SEC-03). Unconditional: docs/03-architecture/api/** and the other tooling inputs are docs paths
      # that still select lane B suites. On a push to main the verifier skips itself (--event push). The run: is pinned
      # line by line (LANE_B_EVIDENCE_SCRIPT_TESTED_BASE in check-workflow-policy, PR23-SEC-06 / D-SEC-PR23-02 (2)): no
      # head-copy bootstrap, no --report-only, no literal event; a missing base fails closed except on push.
      - name: Lane B evidence (quality:check-evidence)
        env:
          TOOLS_REF: ${{ steps.classify.outputs.tools_ref }}
        run: |
          set -euo pipefail
          quality="$RUNNER_TEMP/quality"
          mkdir -p "$quality/base"
          if [ -z "$RANGE_BASE" ] || [ "$RANGE_BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$RANGE_BASE^{commit}" 2>/dev/null; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "### Lane B evidence (quality:check-evidence): not run, the pushed range has no base commit (push skips the check)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error title=Lane B evidence::the range has no base commit; the verifier runs only from the tested base (fail closed, PR23-SEC-06)"
            exit 1
          fi
          if [ -z "$TOOLS_REF" ] || ! git cat-file -e "$TOOLS_REF:tools/quality/check-evidence.mjs" 2>/dev/null; then
            echo "::error title=Lane B evidence::the tested base has no tools/quality/check-evidence.mjs (fail closed, PR46-SEC-17); the head copy is never trusted."
            echo "### Lane B evidence (quality:check-evidence): FAIL, the tested base has no verifier" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git archive "$TOOLS_REF" tools/quality | tar -x -C "$quality/base"
          node "$quality/base/tools/quality/check-evidence.mjs" --root "$GITHUB_WORKSPACE" --base "$RANGE_BASE" --head "$RANGE_HEAD" --event "$GITHUB_EVENT_NAME" --summary "$GITHUB_STEP_SUMMARY"

      - name: Prisma engine cache key
        if: env.CODE == 'true'
        id: engines
        run: |
          set -euo pipefail
          version=$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync('tools/deps/prisma-engines.json','utf8')).enginesVersion)")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the Prisma schema engine (re-verified by deps:rebuild)
        if: env.CODE == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/@prisma/engines/schema-engine-debian-openssl-3.0.x
          key: prisma-engines-${{ runner.os }}-${{ steps.engines.outputs.version }}

      - name: Allow-listed install steps (deps:rebuild)
        if: env.CODE == 'true'
        run: npm run deps:rebuild

      # The PR title is linted because merges are squash merges with an explicit, linted subject (D-TASK007-08,
      # D-ORCH-012): the orchestrator re-lints the exact subject before `gh pr merge --squash --subject`, which also
      # covers a title edited after this run (no `edited` trigger, to save minutes) and a docs-only push, which skips
      # this step (D-ARCH-128). Per-commit messages are checked at the source by the commit-msg hook (npm run
      # hooks:install); linting every PR commit would make one pushed typo unfixable under the no-force-push rule. Pushes
      # to main lint their pushed range.
      - name: Commit messages (commitlint; PR title = squash subject, pushed range on main)
        if: env.CODE == 'true'
        env:
          EVENT: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            printf '%s\n' "$PR_TITLE" | npm exec --no -- commitlint --verbose
          else
            npm exec --no -- commitlint --from "$RANGE_BASE" --to "$RANGE_HEAD" --verbose
          fi

      - name: Lint (ESLint, Stylelint, suppressions)
        if: env.CODE == 'true'
        # The typed ESLint pass over the whole workspace needs more than the runner's default V8 heap (about 2 GB) once
        # packages/audit joins the 020-C rule set (measured 2.1-2.3 GB; the job died with "heap out of memory"). A heap
        # size only, no preload (node-options-preload policy); every rule and file is linted as before (PR #42 fc2). The
        # step env is pinned exactly (PR42-SEC-18).
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run lint

      # PR4-SEC-13 item 1: typegen (React Router config and route modules, vite.config.ts) runs inside `npm run lint`
      # before ESLint, and again in Type-check. A typegen-phase rewrite of a tracked file (an owned lint config, a rule)
      # that a later typegen restores is caught here, before Type-check can restore it.
      - name: Lint must not mutate the tree (git status --porcelain)
        if: env.CODE == 'true'
        run: node "${GATE_CHECK_PORCELAIN:?}" --root "$GITHUB_WORKSPACE" --summary "$GITHUB_STEP_SUMMARY"

      - name: Format check
        if: env.CODE == 'true'
        run: npm run format:check

      # .github/** is code, so a workflow change always runs this step (D-ARCH-128).
      - name: actionlint
        if: env.CODE == 'true'
        run: docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -color

      - name: Type-check
        if: env.CODE == 'true'
        run: npm run typecheck

      - name: Unit tests
        if: env.CODE == 'true'
        run: npm run test:unit

      # The control is "no weakening" (D-ORCH-018): every finding a base fixture expects must still be reported by the
      # head configs, with the same rule id, at least the same severity and the same message, and no fixture may report
      # a finding without a rule id (an unused disable directive, a parse error, an ignored file). The mode variable
      # below is read by the BASE copies of the suite and of tools/lint/fixture-expectations.mjs: extra findings with a
      # rule id (rules the head adds or widens) are listed in the log and the job summary, not failed, and only the
      # positive halves (case-table and platform/* rule completeness, exact ignore and "off" decisions) are skipped; the
      # head suite already ran them with exact semantics in the unit tests. Jest runs under the BASE copy of
      # tools/lint/jest.base-fixtures.config.json, not the head jest.config.ts, so a PR cannot change what its own base
      # run accepts through the suite, fixtures, harness, modes or Jest config. "Base" is the tested base (TOOLS_REF from
      # the classify step's output in the step env, PR46-SEC-17). The step is still an accident guard (PR10-SEC-02): head
      # code that runs earlier in the fast lane and owned configuration (tools/deps/npm-cli.mjs, lint configs and rules,
      # the lockfile) can change its outcome. The mode variable is set on this step only (check-workflow-policy rule
      # lint-fixture-mode flags literal mentions elsewhere), and the step is a required gate whose commands the base
      # checker pins line by line (PR17-SEC-03).
      - name: Lint negative fixtures from the base ref against the head configs (PR2-SEC-08)
        if: env.CODE == 'true' && env.LINT_CONTROLS == 'true'
        env:
          LINT_FIXTURE_MODE: no-weakening
          TOOLS_REF: ${{ steps.classify.outputs.tools_ref }}
        run: |
          set -euo pipefail
          suite=tools/lint/negative-fixtures.test.ts
          config=tools/lint/jest.base-fixtures.config.json
          if ! git cat-file -e "$TOOLS_REF:$suite" 2>/dev/null; then
            echo "Tested base has no $suite; the head copy already ran in the unit tests." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Exact tested-base copies of the suite, its fixtures, its harness, its assertion modes and its Jest config
          # (review m3, m2). Head-only files are removed first: a checkout alone would keep files the PR added.
          base_paths=("$suite" tests/fixtures/lint)
          rm -rf tests/fixtures/lint
          for path in tools/lint/lint-fixtures.mjs tools/lint/fixture-expectations.mjs "$config" tools/test-support; do
            if git cat-file -e "$TOOLS_REF:$path" 2>/dev/null; then
              rm -rf "$path"
              base_paths+=("$path")
            fi
          done
          git checkout "$TOOLS_REF" -- "${base_paths[@]}"
          status=0
          node --experimental-vm-modules --disable-warning=ExperimentalWarning node_modules/jest/bin/jest.js \
            --config "$config" --runTestsByPath "$suite" || status=$?
          rm -rf tests/fixtures/lint tools/test-support
          git checkout HEAD -- "$suite" tests/fixtures/lint tools/test-support tools/lint/lint-fixtures.mjs \
            tools/lint/fixture-expectations.mjs "$config"
          echo "Tested-base lint negative fixtures (no-weakening subset): exit $status" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Build
        if: env.CODE == 'true'
        run: npm run build

      - name: Build must not mutate the tree (git status --porcelain)
        if: env.CODE == 'true'
        run: node "${GATE_CHECK_PORCELAIN:?}" --root "$GITHUB_WORKSPACE" --summary "$GITHUB_STEP_SUMMARY"

      - name: Semgrep rule self-test (when rules or their fixtures change)
        if: env.CODE == 'true' && env.LINT_CONTROLS == 'true'
        run: node tools/ci/run-semgrep.mjs --root "$GITHUB_WORKSPACE" --test --summary "$GITHUB_STEP_SUMMARY"

  # ADR-0023 am. G item 5 as amended by am. L items 2-3 (SEC-P3-07; D-ARCH-127/128; RR-5): the active
  # security_integration_suites of the TESTED BASE's manifest (fast-lane's tools_ref, PR46-SEC-17), run with their
  # lane B runner entries on ubuntu with the runner's Docker (Testcontainers). Once per code tree, on merge-candidate
  # heads: selected when the PR range touches a security-critical path (production-closure lockfile changes only), the
  # head's security record check passes (pass or not-required) and no security-integration success exists on a
  # code-identical commit that tested the same base (security_integration_due, fast-lane's classify step). Skipped is
  # not waived: ci-gate recomputes the selection and requires this job's success or an inherited security proof.
  # PR46-SEC-01: it runs only after fast-lane succeeded with the lane A supply-chain gates (lockfile, cooldown, licences,
  # signatures, audit) passed on this code tree, in this run (full mode) or in the proof run (light mode), so no PR
  # package code runs first. Wall-clock is serial (fast-lane, this job, ci-gate; D-ARCH-128: <= 15 min median).
  security-integration:
    name: security-integration
    needs: [fast-lane]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.fast-lane.result == 'success' && needs.fast-lane.outputs.security_integration_due == 'true' && (needs.fast-lane.outputs.mode == 'full' || needs.fast-lane.outputs.code_proof != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
    steps:
      - name: Checkout (full history for the tested-base manifests)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node from .node-version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (npm ci --ignore-scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prisma engine cache key
        id: engines
        run: |
          set -euo pipefail
          version=$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync('tools/deps/prisma-engines.json','utf8')).enginesVersion)")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the Prisma schema engine (re-verified by deps:rebuild)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/@prisma/engines/schema-engine-debian-openssl-3.0.x
          key: prisma-engines-${{ runner.os }}-${{ steps.engines.outputs.version }}

      - name: Allow-listed install steps (deps:rebuild)
        run: npm run deps:rebuild

      # The manifest and the runners come only from the tested base (a PR neither drops a suite from its own run nor
      # activates one early); a missing tested base or manifest fails closed. The run: and env are pinned line by line in
      # the base-ref policy (SECURITY_INTEGRATION_SCRIPT_TESTED_BASE; PR46-SEC-03, review m1: no head copy, no
      # --dry-run, no `|| true`).
      - name: Security integration suites (tested-base manifest)
        env:
          TOOLS_REF: ${{ needs.fast-lane.outputs.tools_ref }}
        run: |
          set -euo pipefail
          manifests="$RUNNER_TEMP/security-manifests"
          mkdir -p "$manifests"
          for name in required-suites suite-runners; do
            if [ -z "$TOOLS_REF" ] || ! git cat-file -e "$TOOLS_REF:tools/quality/$name.json" 2>/dev/null; then
              echo "::error title=security-integration::the tested base has no tools/quality/$name.json (fail closed; the head copy is never used)"
              exit 1
            fi
            git show "$TOOLS_REF:tools/quality/$name.json" > "$manifests/$name.json"
          done
          node tools/ci/security-integration.mjs --root "$GITHUB_WORKSPACE" --manifest "$manifests/required-suites.json" --runners "$manifests/suite-runners.json" --out "$RUNNER_TEMP/security-integration" --summary "$GITHUB_STEP_SUMMARY"

  # Isolated scans folded into the gate (D-ARCH-128; RR-6; PR10-SEC-02): a fresh runner that never runs npm,
  # node_modules or a workspace script, so nothing the PR controls executes before these gates or reaches the token.
  # Gate scripts and their configuration come from the tested base (TOOLS_REF = HEAD^1 on pull requests, PR46-SEC-17;
  # pinned line by line, PR46-SEC-12; the checkout must be GITHUB_SHA, PR59-SEC-01); while the tested base lacks one
  # (bootstrap) the head copy is extracted with `git archive` and the summary says so. Every base-ref deciding gate
  # runs on every exact head: gitleaks and the
  # security record unconditionally; Semgrep and oasdiff unless this is a docs-only push with a code proof (their
  # success is part of that proof). The lane-scope step recomputes the classification and re-reads the proofs with the
  # binding (PR46-SEC-12); the aggregation (last, unconditional) evaluates the gate rules and is red when fast-lane's
  # classification differs. Runs unless the workflow was cancelled; a skipped lane (draft PR) is not green.
  ci-gate:
    name: ci-gate
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || vars.CI_MAIN_FAST_LANE == 'true') }}
    needs: [fast-lane, security-integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # actions: read for the jobs API and pull-requests: read for the proof binding; the token reaches the lane-scope and
    # aggregation steps only (policy rules gh-token and permissions, PR46-SEC-15).
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      RANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      RANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      EVENT: ${{ github.event_name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout (full history for the tested base and the PR commit range)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node (literal version, no cache)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Gate tooling and scan configuration from the tested base (SEC-P3-31, PR10-SEC-03, PR46-SEC-17)
        run: |
          set -euo pipefail
          gates="$RUNNER_TEMP/gates"
          mkdir -p "$gates/base" "$gates/head"
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error title=Tested base::the checkout is not the event commit GITHUB_SHA (fail closed, PR59-SEC-01)"
            exit 1
          fi
          tools_ref=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            tools_ref=$(git rev-parse --verify --quiet "HEAD^1^{commit}" || true)
            merged=$(git rev-parse --verify --quiet "HEAD^2^{commit}" || true)
            if [ -z "$tools_ref" ] || [ "$merged" != "$RANGE_HEAD" ] || ! git merge-base --is-ancestor "$RANGE_BASE" "$tools_ref"; then
              echo "::error title=Tested base::the checkout is not the test merge of the PR head into a descendant of its base (fail closed, PR46-SEC-17)"
              exit 1
            fi
          elif [ -n "$RANGE_BASE" ] && [ "$RANGE_BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$RANGE_BASE^{commit}" 2>/dev/null; then
            tools_ref="$RANGE_BASE"
          fi
          {
            echo "## Lane A (ci-gate)"
            echo
            echo "Tested base \`${tools_ref:0:7}\`."
            echo
            echo "| Gate input | From |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for path in tools/ci .semgrep .gitleaks.toml .semgrepignore .gitignore; do
            if [ -n "$tools_ref" ] && git cat-file -e "$tools_ref:$path" 2>/dev/null; then
              git archive "$tools_ref" "$path" | tar -x -C "$gates/base"
              echo "| \`$path\` | tested base |" >> "$GITHUB_STEP_SUMMARY"
            elif git cat-file -e "$RANGE_HEAD:$path" 2>/dev/null; then
              git archive "$RANGE_HEAD" "$path" | tar -x -C "$gates/base"
              echo "| \`$path\` | head (bootstrap: not on the tested base yet) |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ -n "$tools_ref" ] && git cat-file -e "$tools_ref:tools/ci/check-security-owned-paths.mjs" 2>/dev/null; then
            echo "RECORD_MODE=enforce" >> "$GITHUB_ENV"
          else
            echo "RECORD_MODE=report-only" >> "$GITHUB_ENV"
          fi
          echo "GATES_DIR=$gates/base" >> "$GITHUB_ENV"
          for tool in run-semgrep check-security-owned-paths openapi-breaking lane-scope; do
            var="GATE_$(echo "$tool" | tr 'a-z-' 'A-Z_')"
            if [ -f "$gates/base/tools/ci/$tool.mjs" ]; then
              echo "$var=$gates/base/tools/ci/$tool.mjs" >> "$GITHUB_ENV"
            else
              [ -d "$gates/head/tools/ci" ] || git archive "$RANGE_HEAD" tools/ci | tar -x -C "$gates/head"
              echo "$var=$gates/head/tools/ci/$tool.mjs" >> "$GITHUB_ENV"
              echo "| \`tools/ci/$tool.mjs\` | head (bootstrap: not on the tested base yet) |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "TOOLS_REF=$tools_ref" >> "$GITHUB_ENV"

      # ADR-0023 am. L items 1-3 (D-ARCH-126..128; PR46-SEC-12): the tested base's lane scope recomputed here, with the
      # proofs re-read through the jobs API under the same binding as fast-lane's (this PR into main, HEAD_REF an env
      # value, PR46-SEC-13) and the same base check (PR46-SEC-16). gh is the runner's binary; no npm, no head code. A
      # failed lookup gives no proof (fail closed). Runs before the scans so a red scan cannot hide the classification.
      - name: Lane scope and proofs (D-ARCH-126/127)
        id: lane-scope
        env:
          GH_TOKEN: ${{ github.token }}
          RANGE_BEFORE: ${{ github.event.before }}
          HEAD_REF: ${{ github.head_ref }}
        run: node "${GATE_LANE_SCOPE:?}" --root "$GITHUB_WORKSPACE" --base "$RANGE_BASE" --head "$RANGE_HEAD" --before "$RANGE_BEFORE" --event "$EVENT" --pr "$PR_NUMBER" --head-ref "$HEAD_REF" --tools-ref "$TOOLS_REF" --lookup --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      # Only .git is mounted: gitleaks loads <source>/.gitleaksignore unconditionally, so no working-tree file may reach
      # /repo. Inline allow markers are inert, merge commits are diffed against their first parent, no network
      # (PR10-SEC-01, review M2). The config is the tested base's, so a PR cannot widen its own allowlist.
      - name: Gitleaks (PR commit range)
        run: |
          set -euo pipefail
          range="$RANGE_BASE..$RANGE_HEAD"
          if [ -z "$RANGE_BASE" ] || [ "$RANGE_BASE" = "0000000000000000000000000000000000000000" ]; then range="-1 $RANGE_HEAD"; fi
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/.git:/repo/.git:ro" -v "$GATES_DIR/.gitleaks.toml:/config/gitleaks.toml:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" git /repo --config /config/gitleaks.toml \
            --log-opts="--diff-merges=first-parent $range" --ignore-gitleaks-allow \
            --redact --no-banner --exit-code 1

      # Skipped only on a docs-only push whose code tree has a code proof (D-ARCH-128): their success on that tree is
      # part of the proof. Any other value (a code push, no proof, an unexpected output) runs them (fail closed).
      - name: Semgrep (rules, .semgrepignore and .gitignore from the base ref; --disable-nosem)
        if: steps.lane-scope.outputs.code_changed != 'false' || steps.lane-scope.outputs.code_proof == ''
        run: node "${GATE_RUN_SEMGREP:?}" --root "$GITHUB_WORKSPACE" --rules-from "$GATES_DIR/.semgrep" --ignore-from "$GATES_DIR" --summary "$GITHUB_STEP_SUMMARY"

      # NFR-MAINT-004, PR #21 R1-m6, D-ORCH-023 (1): the contract at the PR head against the latest release tag merged
      # into the base (strict semver), both read from git objects (never the working tree) into oasdiff with no network.
      # No tag: a smoke run of the head contract against itself, then "no release tag", exit 0 (PR #33 R1-M1). A breaking
      # (ERR) change needs the api/README section 18 record (D-TASK015-03, R1-M2). It runs before the record step so a
      # missing review record (expected on a first push of an owned change) does not hide the contract result.
      - name: OpenAPI breaking changes against the latest release tag (oasdiff, NFR-MAINT-004)
        if: steps.lane-scope.outputs.code_changed != 'false' || steps.lane-scope.outputs.code_proof == ''
        run: node "${GATE_OPENAPI_BREAKING:?}" --root "$GITHUB_WORKSPACE" --base "$RANGE_BASE" --head "$RANGE_HEAD" --image "$OASDIFF_IMAGE" --summary "$GITHUB_STEP_SUMMARY"

      - name: Security-owned paths need a review record (PR5-SEC-04, PR10-SEC-04)
        run: |
          set -euo pipefail
          mode=()
          if [ "$RECORD_MODE" = "report-only" ]; then mode=(--report-only); fi
          if [ "$EVENT" = "pull_request" ]; then
            node "${GATE_CHECK_SECURITY_OWNED_PATHS:?}" --root "$GITHUB_WORKSPACE" --base "$RANGE_BASE" --head "$RANGE_HEAD" --pr "$PR_NUMBER" "${mode[@]}" --summary "$GITHUB_STEP_SUMMARY"
          else
            # A pull-request control: records name branch commits, never the squash commit on main (PR10-SEC-04 item 4).
            echo "Security-owned paths record: pull-request control, not evaluated on push." >> "$GITHUB_STEP_SUMMARY"
          fi

      # RR-6 + D-ARCH-128 + PR46-SEC-12: (a) fast-lane success; (b) a code push ran full with every CODE-gated required
      # step concluded success in this run (jobs API); (c) a docs push has a code proof; (e) security-integration success
      # or a security proof; (f) no missing or malformed classification; (g) fast-lane's classification equals the one
      # recomputed above. A failed scan above fails this job directly (and skips this step). Prints MERGE-READY or
      # BLOCKED: <reasons>.
      - name: Aggregate lane A
        env:
          GH_TOKEN: ${{ github.token }}
          FAST_LANE: ${{ needs.fast-lane.result }}
          FAST_LANE_CLASSIFICATION: ${{ needs.fast-lane.outputs.classification }}
          SECURITY_INTEGRATION: ${{ needs.security-integration.result }}
          CLASSIFICATION: ${{ steps.lane-scope.outputs.classification }}
          FAST_LANE_MODE: ${{ needs.fast-lane.outputs.mode }}
          FAST_LANE_CODE_PROOF: ${{ needs.fast-lane.outputs.code_proof }}
          FAST_LANE_SECURITY_INTEGRATION_DUE: ${{ needs.fast-lane.outputs.security_integration_due }}
          FAST_LANE_TOOLS_REF: ${{ needs.fast-lane.outputs.tools_ref }}
        run: node "${GATE_LANE_SCOPE:?}" --gate --root "$GITHUB_WORKSPACE" --summary "$GITHUB_STEP_SUMMARY"
