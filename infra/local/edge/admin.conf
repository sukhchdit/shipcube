# Staff admin SPA: https://localhost:8444 (platform.md §2.2 edge row, D-008).
server {
    listen 8444 ssl default_server;
    http2 on;
    server_name _;
    access_log /dev/stdout edge;
    include /etc/nginx/conf.d/tls.inc;

    include /etc/nginx/conf.d/api-routes.inc;

    location / {
        proxy_pass http://edge_admin;
        include /etc/nginx/conf.d/static-proxy.inc;
    }
}
