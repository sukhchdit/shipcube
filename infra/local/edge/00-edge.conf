# Local edge proxy, http-level part (TASK-014; platform.md §2.2 edge row, §2.5, PD-08; WAVE-00 sheet lines 516, 527).
#
# compose.yaml mounts this directory read-only over /etc/nginx/conf.d of nginx-unprivileged, so the image's stock
# default.conf is hidden and only these files load: 00-edge.conf (this file), web.conf, admin.conf, storage.conf.
# *.inc files are included by those servers; templates/edge-env.conf.template is rendered by the image's envsubst step
# into /tmp/edge-env.conf (tmpfs) and included below; a missing render fails start-up (fail closed).
# The edge stands in for CloudFront + ALB: /api/* and /health/* go to the api pool, everything else to web or admin.

server_tokens off;

# Access log without Cookie, Authorization or any query string ($uri, not $request_uri): pre-signed URLs carry their
# signature in the query and tracking lookups carry the tracking number (CLAUDE.md §9). Every server block below sets
# `access_log /dev/stdout edge;`, which replaces the image's http-level `main` log for that server.
log_format edge escape=json
    '{"time":"$time_iso8601","host":"$host","server_port":"$server_port","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream":"$upstream_addr","upstream_status":"$upstream_status","upstream_time":"$upstream_response_time"}';

# Docker DNS, re-resolved every 5 s so `--scale api=N` replicas join and leave the pool (platform.md §2.5).
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

# $edge_app_env comes from EDGE_APP_ENV (compose.yaml, default local) through the rendered include. An unset
# EDGE_APP_ENV renders the literal placeholder, which is not "local", so X-Mock-Scenario is stripped (fail closed).
include /tmp/edge-env.conf;

# X-Mock-Scenario reaches the api only when the edge runs for APP_ENV=local (sheet line 516). An empty value makes
# proxy_set_header drop the header.
map $edge_app_env $edge_mock_scenario {
    default "";
    local   $http_x_mock_scenario;
}

upstream edge_api {
    zone edge_api 64k;
    server api:3000 resolve max_fails=1 fail_timeout=5s;
    keepalive 16;
}

upstream edge_web {
    zone edge_web 64k;
    server web:8080 resolve;
    keepalive 8;
}

upstream edge_admin {
    zone edge_admin 64k;
    server admin:8080 resolve;
    keepalive 8;
}

upstream edge_store {
    zone edge_store 64k;
    server rustfs:9000 resolve;
    keepalive 8;
}
