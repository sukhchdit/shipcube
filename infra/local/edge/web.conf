# Customer web app: http://localhost:8080 and https://localhost:8443 (platform.md §2.2 edge row). No HSTS here: the
# edge serves localhost over plain HTTP too, and HSTS on localhost would pin every local port to HTTPS in the browser
# (platform.md §3.3: Compose runs with HSTS_ENABLED=false).
server {
    listen 8080 default_server;
    listen 8443 ssl default_server;
    http2 on;
    server_name _;
    access_log /dev/stdout edge;
    include /etc/nginx/conf.d/tls.inc;

    # The edge's own liveness (Compose health check); the web image keeps its own /healthz behind the edge.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    include /etc/nginx/conf.d/api-routes.inc;

    location / {
        proxy_pass http://edge_web;
        include /etc/nginx/conf.d/static-proxy.inc;
    }
}
