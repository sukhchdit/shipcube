# Store vhost in front of STORAGE_PUBLIC_ENDPOINT=http://localhost:9000 (TASK-014; platform.md §2.2 rustfs paragraph,
# ADR-0021 am. 3 item 1, D-ARCH-100 item 2, PR30-SEC-04/-08). The browser fetches pre-signed URLs here; RustFS itself
# publishes no host port. SigV4 signs the Host header, so it is passed through unchanged; only GET and HEAD are
# forwarded (others 405); every response carries X-Content-Type-Options: nosniff (the only place the Platform can add
# it locally; a CloudFront response-headers policy at M5).

# A Host other than localhost[:port] is refused before it reaches the store.
server {
    listen 9000 default_server;
    server_name _;
    access_log /dev/stdout edge;
    add_header X-Content-Type-Options "nosniff" always;
    return 403;
}

server {
    listen 9000;
    server_name localhost;
    access_log /dev/stdout edge;
    client_max_body_size 1k;
    add_header X-Content-Type-Options "nosniff" always;

    if ($request_method !~ ^(?:GET|HEAD)$) {
        return 405;
    }

    location / {
        proxy_pass http://edge_store;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Unchanged, port included: the pre-signed URL was signed for exactly this Host.
        proxy_set_header Host $http_host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
    }
}
