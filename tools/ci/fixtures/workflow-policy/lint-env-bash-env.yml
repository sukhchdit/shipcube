name: fixture
on:
  pull_request:
permissions:
  contents: read
env:
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'
  CHECKPOINT_DISABLE: '1'
  SCARF_ANALYTICS: 'false'
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          BASH_ENV: ./x.sh
