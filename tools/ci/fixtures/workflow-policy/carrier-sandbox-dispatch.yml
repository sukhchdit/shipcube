name: fixture
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'
  CHECKPOINT_DISABLE: '1'
  SCARF_ANALYTICS: 'false'
jobs:
  contract-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: carrier-sandbox
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
    steps:
      - run: npm run test:contract:live
