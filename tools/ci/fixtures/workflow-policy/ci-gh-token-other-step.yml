name: fixture
on:
  pull_request:
permissions:
  contents: read
env:
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'
  CHECKPOINT_DISABLE: '1'
  SCARF_ANALYTICS: 'false'
jobs:
  scans:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Semgrep
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GATE_RUN_SEMGREP"
