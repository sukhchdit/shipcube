name: fixture
on:
  pull_request:
permissions:
  contents: read
env:
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'
  CHECKPOINT_DISABLE: '1'
  SCARF_ANALYTICS: 'false'
jobs:
  contract-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: carrier-sandbox
    steps:
      - run: npm run test:contract:live
