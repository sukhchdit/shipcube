name: fixture
on:
  pull_request:
permissions:
  contents: read
env:
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'
  CHECKPOINT_DISABLE: '1'
  SCARF_ANALYTICS: 'false'
jobs:
  fast-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "LINT_FIXTURE_MODE=no-weakening" >> "$GITHUB_ENV"
      - run: npm run test:unit
