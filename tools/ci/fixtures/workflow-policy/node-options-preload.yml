name: fixture
on:
  pull_request:
permissions:
  contents: read
env:
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'
  CHECKPOINT_DISABLE: '1'
  SCARF_ANALYTICS: 'false'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: npm run build
        env:
          NODE_OPTIONS: --require ./preload.cjs
