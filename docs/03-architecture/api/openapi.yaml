            - ORDER_NUMBER
            - CUSTOMER_REFERENCE
        shipments:
          type: array
          items:
            $ref: "#/components/schemas/PublicTrackingShipment"
          minItems: 1
          maxItems: 10
      description: "Allow-list only (DR-B31, REQ-TRACK-011): no names, street lines, postcodes, phone, email, references, contents, prices, carrier free text or facility names. additionalProperties false is asserted by the contract test."
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - display_name
        - locale
        - terms_version
        - accept_terms
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        locale:
          $ref: "#/components/schemas/Locale"
        terms_version:
          type: string
          minLength: 1
          maxLength: 32
        accept_terms:
          type: boolean
          const: true
    Accepted:
      type: object
      additionalProperties: false
      required:
        - status
        - message_key
      properties:
        status:
          type: string
          enum:
            - ACCEPTED
        message_key:
          type: string
      description: Uniform 202 body (no enumeration, EC-A01).
    TokenRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: 256-bit base64url one-time token.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          $ref: "#/components/schemas/Email"
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - client_app
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        client_app:
          type: string
          enum:
            - web
            - admin
    TokenResponse:
      type: object
      additionalProperties: false
      required:
        - access_token
        - token_type
        - expires_in
        - session_id
        - active_org_id
        - app
        - mfa_enrolment_required
      properties:
        access_token:
          type: string
          description: ES256 JWT, 15 min; keep in memory only (REQ-AUTH-010).
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          minimum: 1
        session_id:
          $ref: "#/components/schemas/Uuid"
        active_org_id:
          $ref: "#/components/schemas/Uuid"
        app:
          type: string
          enum:
            - web
            - admin
        mfa_enrolment_required:
          type: boolean
          description: Staff session restricted to MFA enrolment routes (REQ-AUTH-018).
      description: Refresh token is only ever set as a __Host- cookie (REQ-AUTH-006).
    MfaChallengeRequest:
      type: object
      additionalProperties: false
      required:
        - mfa_challenge_token
        - method
        - code
      properties:
        mfa_challenge_token:
          type: string
          minLength: 20
          maxLength: 512
        method:
          type: string
          enum:
            - TOTP
            - RECOVERY_CODE
        code:
          type: string
          minLength: 6
          maxLength: 32
          writeOnly: true
    ClientAppRequest:
      type: object
      additionalProperties: false
      required:
        - client_app
      properties:
        client_app:
          type: string
          enum:
            - web
            - admin
    CsrfToken:
      type: object
      additionalProperties: false
      required:
        - csrf_token
        - expires_at
      properties:
        csrf_token:
          type: string
          minLength: 32
        expires_at:
          $ref: "#/components/schemas/Timestamp"
      description: Valid while the refresh session lives; expires_at mirrors the session expiry.
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - new_password
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        new_password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        new_password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
    ReauthRequest:
      type: object
      additionalProperties: false
      required:
        - action_scope
      properties:
        action_scope:
          type: string
          enum:
            - auth.password.change
            - mfa.totp.disable
            - mfa.recovery_codes.regenerate
            - privacy.delete
            - privacy.export
            - payment_method.manage
            - org.member.manage
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        totp_code:
          type: string
          pattern: ^\d{6}$
          writeOnly: true
      description: Supply password, or totp_code for MFA users (REQ-AUTH-020).
    ReauthProof:
      type: object
      additionalProperties: false
      required:
        - reauth_proof
        - action_scope
        - expires_at
      properties:
        reauth_proof:
          type: string
          minLength: 20
        action_scope:
          type: string
        expires_at:
          $ref: "#/components/schemas/Timestamp"
      description: 5 min, single-use, bound to session and scope; send as X-Reauth-Proof.
    SwitchOrganisationRequest:
      type: object
      additionalProperties: false
      required:
        - organisation_id
      properties:
        organisation_id:
          $ref: "#/components/schemas/Uuid"
    TotpEnrolRequest:
      type: object
      additionalProperties: false
      properties:
        enrolment_code:
          type: string
          pattern: ^[0-9]{6}$
          writeOnly: true
          description: Single-use code from requestTotpEnrolmentCode (10 min). Required only for a staff first enrolment when APP_ENV is not local or test (SEC-P3-14).
    TotpEnrolment:
      type: object
      additionalProperties: false
      required:
        - provisioning_uri
        - manual_key
        - expires_at
      properties:
        provisioning_uri:
          type: string
          pattern: ^otpauth://totp/
        manual_key:
          type: string
          pattern: ^[A-Z2-7]{16,64}$
        expires_at:
          $ref: "#/components/schemas/Timestamp"
      description: Secret shown once; pending enrolment expires in 15 min (REQ-AUTH-015).
    TotpCodeRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: ^\d{6}$
          writeOnly: true
