  /quotes/{quoteId}/stream:
    get:
      tags:
        - quotes
      operationId: streamQuoteResults
      summary: Stream rate-shopping results (SSE)
      description: |-
        Server-sent events (REQ-API-017/018): `Content-Type: text/event-stream`, `Cache-Control: no-cache`, `X-Accel-Buffering: no`, monotonically increasing `id`, comment heartbeat every 15 s. Events: `carrier_result` (SseCarrierResult: one carrier's priced options), `carrier_error` (SseCarrierError: carrier code, state timeout|error, canonical code; no raw text), `complete` (SseComplete: counts per status, per-carrier status, elapsed ms; sent by 5 s), `error` (SseError). The server closes within 1 s after `complete`/`error`, caps the stream at 30 s (normally closed by 6 s) and cancels upstream work within 1 s of client disconnect. Reconnect with `Last-Event-ID` (any replica): missed events are replayed from the persisted results before live events; the event id is the per-quote sequence number (ADR-0016 amendment 3). getQuote remains the non-streaming fallback. Authorised with the bearer header via a fetch-based client or, for guests, X-Quote-Token. Events carry no personal data.

        Opening or reopening a stream never triggers carrier fan-out: fan-out happens once, at `POST /quotes` (`createQuote`); the stream only replays the persisted results and subscribes to new ones, so reconnects cost no carrier calls (SEC-P3-02, SEC-TC-42). Concurrent open streams are capped at 2 per client IP (IPv6 /64) and 5 per user (`SSE_MAX_STREAMS_PER_IP`, `SSE_MAX_STREAMS_PER_USER`, shared across replicas in Redis); the next stream is refused before it opens with 429 RATE_LIMITED and `Retry-After` (threat model R-15, T-47).

        **Requirements:** REQ-CARR-009, REQ-API-017, REQ-API-018, REQ-QUOTE-008. **Permission:** `public` (Guest branch authorised by the quote token; tenant branch requires quote:read.). **Audit:** VIEW `quote` SENSITIVE. **Idempotency:** not-applicable. **Rate-limit class:** public (plus at most 2 concurrent streams per IP and 5 per user (SEC-P3-02)). **Tenancy:** guest.
      security:
        - bearerAuth: []
        - quoteToken: []
      parameters:
        - $ref: "#/components/parameters/QuoteIdPath"
        - $ref: "#/components/parameters/LastEventId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Event stream.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Accel-Buffering:
              $ref: "#/components/headers/XAccelBuffering"
          content:
            text/event-stream:
              schema:
                type: string
                description: text/event-stream; see x-sse-events.
              examples:
                default:
                  summary: Mock OK, DHL timeout, complete
                  value: |
                    id: 1
                    event: carrier_result
                    data: {"carrier_code":"MOCK","status":"OK","options":[],"exclusions":[],"cached":false,"elapsed_ms":212}

                    : heartbeat

                    id: 2
                    event: carrier_error
                    data: {"carrier_code":"DHL_EXPRESS","state":"timeout","code":"TIMEOUT","elapsed_ms":4000}

                    id: 3
                    event: complete
                    data: {"counts":{"OK":1,"NO_SERVICE":0,"TIMEOUT":1,"ERROR":0},"carriers":[{"carrier_code":"MOCK","status":"OK"},{"carrier_code":"DHL_EXPRESS","status":"TIMEOUT"}],"option_count":3,"elapsed_ms":4012}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-requirements:
        - REQ-CARR-009
        - REQ-API-017
        - REQ-API-018
        - REQ-QUOTE-008
      x-permission: public
