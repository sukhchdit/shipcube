  /shipments/{shipmentId}/cancel:
    post:
      tags:
        - shipments
      operationId: cancelShipment
      summary: Cancel a shipment
      description: |-
        BOOKED, LABEL_READY or PICKUP_SCHEDULED before any PICKED_UP/DROPPED_OFF scan: shipment to CANCELLED, then pickup cancel, carrier void (VOIDED) and automatic full refund (REFUNDED) run asynchronously; DRAFT/QUOTED/PENDING_PAYMENT cancel without carrier or refund steps. Otherwise 409 SHIPMENT_NOT_CANCELLABLE (DR-B20). Repeating is idempotent. Void failure moves to EXCEPTION without refund (REQ-BOOK-030).

        **Requirements:** REQ-BOOK-029, REQ-BOOK-030, REQ-ACCT-007, REQ-PICK-008, REQ-PAY-013. **Permission:** `shipment:cancel`. **Audit:** STATE_TRANSITION `shipment` SENSITIVE. **Idempotency:** required. **Rate-limit class:** authenticated. **Tenancy:** tenant.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ShipmentIdPath"
        - $ref: "#/components/parameters/MockScenario"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelShipmentRequest"
            examples:
              default:
                summary: Example
                value:
                  reason_code: WRONG_ADDRESS
                  reason_text: Receiver moved
      responses:
        "202":
          description: Cancellation accepted; void and refund continue asynchronously.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            ETag:
              $ref: "#/components/headers/ETag"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
