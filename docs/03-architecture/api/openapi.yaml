              amount:
                $ref: "#/components/schemas/Money"
              status:
                type: string
                enum:
                  - PENDING
                  - SUCCEEDED
                  - FAILED
              created_at:
                $ref: "#/components/schemas/Timestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
