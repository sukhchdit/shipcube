# Platform API contract: source of truth (REQ-API-002). Change only through the contract change process in README.md.
openapi: 3.1.0
info:
  title: Platform API
  version: 1.0.0-m1
  summary: Multi-carrier shipping platform API (milestones M0 + M1).
  description: |-
    Contract-first REST API of the Platform (brief §4.8, REQ-API-002). The same API serves the customer web app and the staff admin app. This document is the source of truth: route metadata (`defineRoute`), Joi schemas and generated frontend types are checked against it in CI (see docs/03-architecture/api/README.md).

    **Conventions (ADR-0016)**
    - Base path `/api/v1` (REQ-API-001); health endpoints outside the prefix. Kebab-case plural resources; actions are POST sub-resources.
    - Errors: RFC 9457 `application/problem+json` with stable `code` and `correlation_id`; validation failures are 400 `VALIDATION_ERROR` with `errors[]` of {pointer, code, message} (REQ-API-005/006). Unknown fields are rejected (`UNKNOWN_FIELD`, REQ-SEC-007). A resource of another organisation is indistinguishable from a missing one (404).
    - Lists: cursor pagination `limit` (default 25, max 100; audit 50/200) + `cursor`, response `items`, `next_cursor`, `has_more`; filtering `filter[field]=value`; sorting `sort=field,-field` from per-route allow-lists (REQ-API-007/008).
    - `Idempotency-Key` on unsafe operations (required where `x-idempotency: required`), 24 h replay with `Idempotent-Replayed: true` (DR-A20).
    - Strong `ETag` on single-resource GETs; `If-Match` required on PUT/PATCH/DELETE of versioned resources (428/412) (REQ-API-012/013).
    - `RateLimit-Limit/Remaining/Reset` headers; 429 with `Retry-After` (REQ-API-014, DR-A22).
    - Money is `{amount: integer minor units, currency: ISO 4217}`; weights in integer grams, dimensions in integer millimetres; timestamps ISO 8601 UTC ending in `Z`; local dates `YYYY-MM-DD` with an IANA zone; FX rates as decimal strings (REQ-API-016).
    - Server-sent events per REQ-API-017/018 (`carrier_result`, `carrier_error`, `complete`).
    - Deprecation via `Deprecation`, `Sunset` and `Link: rel="deprecation"` headers (REQ-API-015); no operation is deprecated in this version.

    **Vendor extensions on every operation:** `x-requirements`, `x-permission` (+ `x-permission-justification` for `public`/`authenticated`), `x-audit` {action, entity, sensitivity, reasonRequired, justification?}, `x-idempotency`, `x-rate-limit-class`, `x-tenancy`, `x-error-codes`, `x-milestone`, `x-moscow`; optional `x-csrf`, `x-mfa-gate-exempt`, `x-reauth-scope`, `x-reauth-max-age` (seconds; with `x-reauth-scope`, the route accepts either a valid `X-Reauth-Proof` for the scope or an access token whose `auth_time` is at most this old; without it a proof is always required), `x-permission-authenticated`, `x-permission-status`, `x-rate-limit-route`, `x-sse-events`.

    All example data is synthetic.
  contact:
    name: Platform API team
    url: https://github.com/sukhchdit/shipcube
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:3000/api/v1
    description: Local (docker compose).
  - url: https://api.{domain}/api/v1
    description: Deployed environment template.
    variables:
      domain:
        default: staging.platform.invalid
        description: Environment domain from BRAND/DNS configuration.
security:
  - bearerAuth: []
tags:
  - name: identity
    description: Registration, sign-in, tokens, MFA, password and re-authentication (REQ-AUTH).
  - name: me
    description: "The signed-in user: profile, memberships, sessions, dashboard and privacy self-service (REQ-ORG-005, REQ-AUTH-021/022, REQ-ACCT)."
  - name: organisations
    description: Organisation profile, members, invitations and address book (REQ-ORG, REQ-ACCT-008..010, REQ-ACCT-014/015).
  - name: reference
    description: Public, cached reference data and calculators (REQ-DATA-016, REQ-QUOTE-021/022).
  - name: compliance
    description: Public compliance-pack subset, legal texts and cookie consent records (REQ-COMP, REQ-UI-023).
  - name: quotes
    description: Quotes, rate-shopping stream, claim, save and share (REQ-QUOTE, REQ-CARR-009).
  - name: shipments
    description: Draft shipments, wizard sections, cancellation, history and repeat (REQ-BOOK, REQ-ACCT).
  - name: customs
    description: Customs lines, prohibited/restricted checks, de-minimis hint (REQ-CUST).
  - name: documents
    description: "Labels and customs documents: list, download, email (REQ-DOC)."
  - name: orders
    description: Basket, coupon, checkout and booking progress (REQ-BOOK-013..017, REQ-BOOK-024..026).
  - name: payments
    description: Payments, 3-D Secure confirmation and saved payment methods (REQ-PAY).
  - name: pickups
    description: Pickup availability, scheduling, rescheduling, cancellation and drop-off points (REQ-PICK).
  - name: tracking
    description: Authenticated tracking timeline, manual refresh and public tracking (REQ-TRACK).
  - name: notifications
    description: Notification preferences and the per-user notification log (REQ-NOTIF, REQ-ACCT-012).
  - name: carriers
    description: Staff carrier account status (REQ-CARR-015).
  - name: audit
    description: Read-only audit viewer API (REQ-AUDIT-019..023).
  - name: feature-flags
    description: Feature-flag evaluation and administration (REQ-PLAT-020/021).
  - name: security
    description: CSP violation reports (REQ-SEC-002).
  - name: webhooks
    description: "Inbound, signature-authenticated webhooks: Stripe, Mock gateway, carrier push (REQ-PAY-011/012, REQ-TRACK-006)."
  - name: health
    description: Liveness and readiness probes outside /api/v1 (REQ-PLAT-018).
paths:
  /auth/register:
    post:
      tags:
        - identity
      operationId: registerUser
      summary: Register a user
      description: |-
        Creates, in one transaction, the user (PENDING_VERIFICATION), a personal INDIVIDUAL organisation with the user as Owner and the terms acceptance, then sends the verification email via the outbox (`auth.email_verification`). An existing email returns the identical 202 and an "account already exists" email (EC-A01). Password policy failures are 400 VALIDATION_ERROR sub-code PASSWORD_POLICY.

        **Requirements:** REQ-AUTH-001, REQ-AUTH-002, REQ-AUTH-003, REQ-ORG-002. **Permission:** `public` (Anonymous self-registration.). **Audit:** CREATE `user` SENSITIVE. **Idempotency:** not-applicable. **Rate-limit class:** auth. **Tenancy:** user.
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              default:
                summary: Example
                value:
                  email: ana@acme.example
                  password: correct-horse-battery-42
                  display_name: Ana Example
                  locale: en
                  terms_version: 2026-11
                  accept_terms: true
      responses:
        "202":
          description: Accepted (identical for new and existing emails).
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
              examples:
                default:
                  summary: Example
                  value:
                    status: ACCEPTED
                    message_key: auth.register.accepted
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-requirements:
        - REQ-AUTH-001
        - REQ-AUTH-002
        - REQ-AUTH-003
        - REQ-ORG-002
      x-permission: public
      x-permission-justification: Anonymous self-registration.
      x-audit:
        action: CREATE
        entity: user
        sensitivity: SENSITIVE
        reasonRequired: false
      x-idempotency: not-applicable
      x-rate-limit-class: auth
      x-tenancy: user
      x-error-codes:
        - MALFORMED_REQUEST
        - VALIDATION_ERROR
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - RATE_LIMITED
        - AUDIT_WRITE_FAILED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
      x-milestone: M0
      x-moscow: Must
  /auth/verify-email:
    post:
      tags:
        - identity
      operationId: verifyEmail
      summary: Redeem an email-verification token
      description: |-
        The email link carries the token in the URL fragment; the SPA posts it here (ADR-0016 amendment 2). Marks `email_verified_at` and moves the user PENDING_VERIFICATION to ACTIVE. Used or unknown token: 400 TOKEN_INVALID; expired: 410 TOKEN_EXPIRED.

        **Requirements:** REQ-AUTH-004. **Permission:** `public` (Token-authenticated link from email.). **Audit:** UPDATE `user` SENSITIVE. **Idempotency:** not-applicable. **Rate-limit class:** auth. **Tenancy:** user.
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
            examples:
              default:
                summary: Example
                value:
                  token: Vf3kQ9xL2mN8pR4tW7yZ1aC5eG0hJ6bD3sU9iO2qE8r
      responses:
        "204":
          description: Email verified.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-requirements:
        - REQ-AUTH-004
      x-permission: public
      x-permission-justification: Token-authenticated link from email.
      x-audit:
        action: UPDATE
        entity: user
        sensitivity: SENSITIVE
        reasonRequired: false
      x-idempotency: not-applicable
      x-rate-limit-class: auth
      x-tenancy: user
      x-error-codes:
        - MALFORMED_REQUEST
        - TOKEN_INVALID
        - VALIDATION_ERROR
        - TOKEN_EXPIRED
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - RATE_LIMITED
        - AUDIT_WRITE_FAILED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
      x-milestone: M0
      x-moscow: Must
  /auth/resend-verification:
    post:
      tags:
        - identity
      operationId: resendVerificationEmail
      summary: Resend the verification email
      description: |-
        Invalidates earlier verification tokens and sends a new one. Always 202 (no enumeration). Limited to 3/h per account and 10/h per IP.

        **Requirements:** REQ-AUTH-004. **Permission:** `public` (Unverified users may not hold a session on this device.). **Audit:** CREATE `email_verification_token` NORMAL. **Idempotency:** not-applicable. **Rate-limit class:** email-send (3/h per account identifier and 10/h per IP (DR-A22)). **Tenancy:** user.
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
            examples:
              default:
                summary: Example
                value:
                  email: ana@acme.example
      responses:
        "202":
          description: Success.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
              examples:
                default:
                  summary: Example
                  value:
                    status: ACCEPTED
                    message_key: auth.verification.resent
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-requirements:
        - REQ-AUTH-004
      x-permission: public
      x-permission-justification: Unverified users may not hold a session on this device.
      x-audit:
        action: CREATE
        entity: email_verification_token
        sensitivity: NORMAL
        reasonRequired: false
      x-idempotency: not-applicable
      x-rate-limit-class: email-send
      x-rate-limit-route: 3/h per account identifier and 10/h per IP (DR-A22)
      x-tenancy: user
      x-error-codes:
        - MALFORMED_REQUEST
        - VALIDATION_ERROR
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - RATE_LIMITED
        - AUDIT_WRITE_FAILED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
      x-milestone: M0
      x-moscow: Must
  /auth/login:
    post:
      tags:
        - identity
      operationId: loginUser
      summary: Sign in with email and password
      description: |-
        Returns a 15-minute access token and sets the app-specific refresh cookie. Unknown email, wrong password, suspended/deactivated user, or a non-staff user on `client_app: admin` all return the identical 401 INVALID_CREDENTIALS (REQ-ADMIN-003). Users with TOTP receive 401 MFA_REQUIRED with `mfa_challenge_token`. Progressive delay after 5 failures (429 ACCOUNT_DELAYED), 15-minute lock after 10 (429 ACCOUNT_LOCKED). Staff without TOTP get a token with `mfa_enrolment_required: true` restricted to enrolment routes (REQ-AUTH-018).

        **Requirements:** REQ-AUTH-005, REQ-AUTH-006, REQ-AUTH-013, REQ-AUTH-014, REQ-AUTH-017, REQ-AUTH-024, REQ-ADMIN-003. **Permission:** `public` (Credential exchange.). **Audit:** LOGIN `session` SENSITIVE. **Idempotency:** not-applicable. **Rate-limit class:** auth (10/min per IP and 5/min per account identifier (DR-A22)). **Tenancy:** user.
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              default:
                summary: Example
                value:
                  email: ana@acme.example
                  password: correct-horse-battery-42
                  client_app: web
      responses:
        "200":
          description: Signed in; refresh cookie set.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            Set-Cookie:
              $ref: "#/components/headers/SetCookieRefresh"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              examples:
                default:
                  summary: Example
                  value:
                    access_token: eyJhbGciOiJFUzI1NiIsImtpZCI6ImsxIn0.eyJzdWIiOiJ1In0.c2lnbmF0dXJl
                    token_type: Bearer
                    expires_in: 900
                    session_id: 0193a5b2-7c1e-7d4a-9f3b-000000000d01
                    active_org_id: 0193a5b2-7c1e-7d4a-9f3b-000000000a01
                    app: web
                    mfa_enrolment_required: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-requirements:
        - REQ-AUTH-005
        - REQ-AUTH-006
        - REQ-AUTH-013
        - REQ-AUTH-014
        - REQ-AUTH-017
        - REQ-AUTH-024
        - REQ-ADMIN-003
      x-permission: public
      x-permission-justification: Credential exchange.
      x-audit:
        action: LOGIN
        entity: session
        sensitivity: SENSITIVE
        reasonRequired: false
        justification: Failures write LOGIN_FAILED (DENIED) and ACCOUNT_LOCKED; security log events login_failed/account_locked.
      x-idempotency: not-applicable
      x-rate-limit-class: auth
      x-rate-limit-route: 10/min per IP and 5/min per account identifier (DR-A22)
      x-tenancy: user
      x-error-codes:
        - MALFORMED_REQUEST
        - VALIDATION_ERROR
        - INVALID_CREDENTIALS
        - MFA_REQUIRED
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - ACCOUNT_DELAYED
        - ACCOUNT_LOCKED
        - RATE_LIMITED
        - AUDIT_WRITE_FAILED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
      x-milestone: M0
      x-moscow: Must
  /auth/mfa/challenge:
    post:
      tags:
        - identity
      operationId: completeMfaChallenge
      summary: Complete the MFA challenge
      description: |-
        Exchanges the MFA challenge token plus a TOTP code or a recovery code for session tokens. Wrong code: 401 MFA_INVALID; 5 consecutive wrong codes lock MFA for the user for 15 min across challenges and IPs (429 MFA_LOCKED; ADR-0006 amendment 3). Using a recovery code emits `auth.security_event` RECOVERY_CODE_USED.

        **Requirements:** REQ-AUTH-017, REQ-AUTH-016, REQ-AUTH-015. **Permission:** `public` (Second factor of sign-in; authenticated by the challenge token.). **Audit:** LOGIN `session` SENSITIVE. **Idempotency:** not-applicable. **Rate-limit class:** auth. **Tenancy:** user.
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaChallengeRequest"
            examples:
              default:
                summary: Example
                value:
                  mfa_challenge_token: mfa_ch_7Kq2Zr9VbN4mX1pL8cW3sYh6dF0gA5eR
                  method: TOTP
                  code: "492817"
      responses:
        "200":
          description: Success.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            Set-Cookie:
              $ref: "#/components/headers/SetCookieRefresh"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              examples:
                default:
                  summary: Example
                  value:
                    access_token: eyJhbGciOiJFUzI1NiIsImtpZCI6ImsxIn0.eyJzdWIiOiJ1In0.c2lnbmF0dXJl
                    token_type: Bearer
                    expires_in: 900
                    session_id: 0193a5b2-7c1e-7d4a-9f3b-000000000d01
                    active_org_id: 0193a5b2-7c1e-7d4a-9f3b-000000000a01
                    app: admin
                    mfa_enrolment_required: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-requirements:
        - REQ-AUTH-017
        - REQ-AUTH-016
        - REQ-AUTH-015
      x-permission: public
      x-permission-justification: Second factor of sign-in; authenticated by the challenge token.
      x-audit:
        action: LOGIN
        entity: session
        sensitivity: SENSITIVE
        reasonRequired: false
        justification: Failures write MFA_FAILED.
      x-idempotency: not-applicable
      x-rate-limit-class: auth
      x-tenancy: user
      x-error-codes:
        - MALFORMED_REQUEST
        - TOKEN_INVALID
        - VALIDATION_ERROR
        - MFA_INVALID
        - TOKEN_EXPIRED
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - MFA_LOCKED
        - RATE_LIMITED
        - AUDIT_WRITE_FAILED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
      x-milestone: M0
      x-moscow: Must
  /auth/refresh:
    post:
      tags:
        - identity
      operationId: refreshSession
      summary: Rotate the refresh token
      description: |-
        Cookie-authenticated (no bearer). Requires an allow-listed Origin and `X-CSRF-Token`. Rotates the refresh token in the same family and returns a new access token. Presenting a rotated or revoked token revokes the whole family and session: 401 SESSION_REVOKED, audit TOKEN_REUSE_DETECTED, security event refresh_token_reuse (EC-A04/EC-A05). Customer sessions: 30-day sliding refresh lifetime (`AUTH_REFRESH_TTL`) inside a 30-day absolute cap (`AUTH_SESSION_ABSOLUTE_TTL`); admin sessions: 30-minute sliding idle lifetime (`AUTH_ADMIN_REFRESH_IDLE_TTL`) inside a 12 h absolute cap. A refresh token past either limit gets 401 SESSION_EXPIRED (audit reason `SESSION_EXPIRED`); sign in again (SEC-P3-01, SEC-P3-11). The new access token carries the session's `auth_time` unchanged: refresh never renews it.

        **Requirements:** REQ-AUTH-007, REQ-AUTH-008, REQ-AUTH-010, REQ-SEC-004, REQ-ADMIN-004. **Permission:** `public` (Authenticated by the refresh cookie plus CSRF token, not by a bearer token.). **Audit:** UPDATE `session` SENSITIVE. **Idempotency:** not-applicable. **Rate-limit class:** public (not an auth-class route in DR-A22; 120/min per IP). **Tenancy:** user.
      security:
        - refreshCookieWeb: []
          csrfToken: []
        - refreshCookieAdmin: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientAppRequest"
            examples:
              default:
                summary: Example
                value:
                  client_app: web
      responses:
        "200":
          description: Success.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            Set-Cookie:
              $ref: "#/components/headers/SetCookieRefresh"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              examples:
                default:
                  summary: Example
                  value:
                    access_token: eyJhbGciOiJFUzI1NiIsImtpZCI6ImsxIn0.eyJzdWIiOiJ1In0.c2lnbmF0dXJl
                    token_type: Bearer
                    expires_in: 900
                    session_id: 0193a5b2-7c1e-7d4a-9f3b-000000000d01
                    active_org_id: 0193a5b2-7c1e-7d4a-9f3b-000000000a01
                    app: web
                    mfa_enrolment_required: false
        "400":
