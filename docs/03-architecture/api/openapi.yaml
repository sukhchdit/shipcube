                  - TIMEOUT
                  - ERROR
        option_count:
          type: integer
          minimum: 0
        elapsed_ms:
          type: integer
          minimum: 0
      description: SSE event `complete`; sent by 5 s, stream closed within 1 s after (REQ-API-018).
    SseError:
      type: object
