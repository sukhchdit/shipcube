        - estimated_delivery_date
        - events
      properties:
        carrier_name:
          type: string
        service_name:
          type: string
        current_status:
          oneOf:
            - $ref: "#/components/schemas/TrackingStatus"
            - type: "null"
        estimated_delivery_date:
          oneOf:
            - $ref: "#/components/schemas/LocalDate"
            - type: "null"
        events:
          type: array
          items:
            $ref: "#/components/schemas/PublicTrackingEvent"
    PublicTracking:
