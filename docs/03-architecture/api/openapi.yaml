    get:
      tags:
        - tracking
      operationId: getPublicTracking
      summary: Public tracking lookup
      description: |-
        No login. Exactly one of `tracking_number` or `order_number` (Luhn check digit validated before any query; lists every shipment of the order). The customer-reference + postcode variant is `lookupPublicTracking` (POST, ADR-0016 amendment 2). Every miss returns the identical 404 TRACKING_NOT_FOUND with comparable timing (REQ-TRACK-012). Response is the DR-B31 allow-list only. Responses are `noindex`.

        **Requirements:** REQ-TRACK-008, REQ-TRACK-010, REQ-TRACK-011, REQ-TRACK-012, REQ-DATA-015. **Permission:** `public` (Public tracking page (brief §4.6).). **Audit:** VIEW `shipment_tracking` NORMAL. **Idempotency:** not-applicable. **Rate-limit class:** public-tracking (30/min and 300/h per IP; unsuccessful lookups 10/min per IP). **Tenancy:** public.
      security: []
      parameters:
        - name: tracking_number
          in: query
          required: false
          description: Carrier tracking number.
          schema:
            type: string
            minLength: 6
            maxLength: 40
            pattern: ^[A-Za-z0-9]+$
        - name: order_number
          in: query
          required: false
          description: Platform order number.
          schema:
            type: string
            pattern: ^[A-Z]{2}-\d{9}$
