        - name: filter
          in: query
          required: false
          style: deepObject
          explode: true
          description: "Allow-listed filters combined with AND (REQ-API-008): filter[type], filter[status]. Others: 400 INVALID_FILTER."
          schema:
            type: object
            additionalProperties: false
            properties:
              type:
