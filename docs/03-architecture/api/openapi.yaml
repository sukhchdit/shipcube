      properties:
        recovery_codes:
          type: array
          items:
            type: string
            minLength: 10
            maxLength: 10
            pattern: ^[A-Z0-9]{10}$
          minItems: 10
          maxItems: 10
        generated_at:
          $ref: "#/components/schemas/Timestamp"
      description: Shown once; 10 codes of 10 characters from a 32-symbol alphabet, about 50 bits each (REQ-AUTH-016, ADR-0006 amendment 3).
    UserProfile:
