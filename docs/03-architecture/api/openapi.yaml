              type: integer
              minimum: 1
        cutoff_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        holidays_unreviewed:
          type: boolean
      description: DR-B25 computation for the shipment service and sender address.
    ServicePoint:
      type: object
      additionalProperties: false
      required:
