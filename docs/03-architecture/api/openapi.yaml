components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ES256 access token (15 min) from loginUser, completeMfaChallenge, refreshSession or switchOrganisation; claims sub, sid, org, app, mfa, auth_time, iat, exp, jti; no roles or permissions (ADR-0006, REQ-AUTH-005). `auth_time` (OIDC, seconds since epoch) is the time of the last password or MFA verification; it is set at login, updated when the MFA challenge completes and when createReauthProof succeeds, copied unchanged by refresh (persisted as sessions.authenticated_at; SEC-P3-01). Routes with x-reauth-max-age compare it with the current time. Held in memory only.
    refreshCookieWeb:
      type: apiKey
      in: cookie
      name: __Host-rt_web
      description: "Customer web refresh token cookie (__Host- prefix: HttpOnly, Secure, SameSite=Strict, Path=/, no Domain), read by the server only on /auth/csrf, /auth/refresh and /auth/logout (ADR-0006 amendment 1); rotated on every refresh with reuse detection (REQ-AUTH-006..008). 30-day sliding lifetime (AUTH_REFRESH_TTL) inside a 30-day absolute session cap (AUTH_SESSION_ABSOLUTE_TTL; SEC-P3-01); past the cap refresh returns 401 SESSION_EXPIRED."
    refreshCookieAdmin:
      type: apiKey
      in: cookie
      name: __Host-rt_admin
      description: Admin app refresh token cookie, same attributes as __Host-rt_web; 12 h absolute session cap (REQ-ADMIN-004) and a 30-minute sliding idle lifetime (AUTH_ADMIN_REFRESH_IDLE_TTL=30m; SEC-P3-11); past either limit refresh returns 401 SESSION_EXPIRED.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Signed CSRF token from getCsrfToken (base64url HMAC-SHA256 over session id and app, recomputed on verification; ADR-0006 amendment 2), required with an allow-listed Origin on cookie-authenticated routes (REQ-SEC-004).
    quoteToken:
      type: apiKey
      in: header
      name: X-Quote-Token
      description: Guest quote access token (>= 128 bits) returned once by createQuote (REQ-QUOTE-002, REQ-RLS-013).
    stripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: Stripe webhook signature over the raw body, 300 s tolerance (REQ-PAY-011).
    mockGatewaySignature:
      type: apiKey
      in: header
      name: X-Mock-Signature
      description: HMAC-SHA256 signature of the Mock gateway webhook (timestamp + raw body), 300 s tolerance; non-production only (REQ-PAY-002).
    carrierSignature:
      type: apiKey
      in: header
      name: X-Carrier-Signature
      description: Carrier push signature or shared secret; the adapter declares the concrete header and algorithm (REQ-TRACK-006).
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Inbound correlation ID; accepted when it matches ^[A-Za-z0-9-]{8,64}$, otherwise generated. Echoed in the response (REQ-PLAT-011).
      schema:
        type: string
        pattern: ^[A-Za-z0-9-]{8,64}$
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Locale negotiation for localised labels; en, es, fr; others resolve to en (REQ-I18N-006).
      schema:
        type: string
        maxLength: 200
      example: es-MX,es;q=0.9,en;q=0.5
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 1-255 printable ASCII (UUIDv4 recommended). Stored 24 h with a SHA-256 request fingerprint, scoped by organisation (or guest token) + actor + method + path (DR-A20).
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[\x21-\x7E]+$
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: "Required on this operation (creates an order, payment or booking; REQ-API-009). Missing: 400 IDEMPOTENCY_KEY_REQUIRED. Semantics DR-A20."
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[\x21-\x7E]+$
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: "Strong ETag of the version being modified. Missing: 428 PRECONDITION_REQUIRED; stale: 412 CONCURRENCY_CONFLICT (REQ-API-013)."
      schema:
        type: string
        pattern: ^"[0-9a-f-]{36}:[0-9]+"$
      example: '"0193a5b2-7c1e-7d4a-9f3b-000000000f01:3"'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Conditional GET; a matching ETag returns 304 with no body (REQ-API-012).
      schema:
        type: string
    QuoteToken:
      name: X-Quote-Token
      in: header
      required: false
      description: "Guest quote access token returned once by createQuote. Never placed in URLs (REQ-QUOTE-002, A-078: wrong or missing token gives 404)."
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{43}$
    MockScenario:
      name: X-Mock-Scenario
      in: header
      required: false
      description: "Mock carrier directives, e.g. `latency=6000;fail=booking`. Keys latency, fail, error, rates, track (DR-B29). Ignored in production (REQ-CARR-006). Invalid: 400 MOCK_SCENARIO_INVALID."
      schema:
        type: string
        maxLength: 256
        pattern: ^[a-z_]+=[A-Za-z0-9_]+(;[a-z_]+=[A-Za-z0-9_]+)*$
    ReauthProof:
      name: X-Reauth-Proof
      in: header
      required: true
      description: "Proof from createReauthProof for this action scope (5 min, single-use; REQ-AUTH-020). Missing/invalid: 401 REAUTH_REQUIRED."
      schema:
        type: string
        minLength: 20
        maxLength: 512
    ReauthProofConditional:
      name: X-Reauth-Proof
      in: header
      required: false
      description: "Proof from createReauthProof for this action scope (5 min, single-use; REQ-AUTH-020). Needed only when the access token's auth_time is older than the operation's x-reauth-max-age (SEC-P3-01); then missing/invalid: 401 REAUTH_REQUIRED. A proof that is sent is always verified and consumed."
      schema:
        type: string
        minLength: 20
        maxLength: 512
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Resume after this event id; missed events are replayed from the database before live events (ADR-0016 amendment 3).
      schema:
        type: string
        pattern: ^[0-9]{1,10}$
    Cursor:
      name: cursor
      in: query
      required: false
      description: "Opaque cursor from next_cursor (REQ-API-007). Tampered/expired: 400 INVALID_CURSOR."
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, default 25, max 100; out of range is 400 VALIDATION_ERROR, never clamped (DR-A21).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    OrgIdPath:
      name: orgId
      in: path
      required: true
      description: Organisation ID; must equal the active organisation (REQ-ORG-005) else 404.
      schema:
        $ref: "#/components/schemas/Uuid"
    MembershipIdPath:
      name: membershipId
      in: path
      required: true
      description: Membership ID.
      schema:
        $ref: "#/components/schemas/Uuid"
    InvitationIdPath:
      name: invitationId
      in: path
      required: true
      description: Invitation ID.
      schema:
        $ref: "#/components/schemas/Uuid"
    EntryIdPath:
      name: entryId
      in: path
      required: true
      description: Address-book entry ID.
      schema:
        $ref: "#/components/schemas/Uuid"
    QuoteIdPath:
      name: quoteId
      in: path
      required: true
      description: Quote ID.
      schema:
        $ref: "#/components/schemas/Uuid"
    ShipmentIdPath:
      name: shipmentId
      in: path
      required: true
      description: Shipment ID.
      schema:
        $ref: "#/components/schemas/Uuid"
    OrderIdPath:
      name: orderId
      in: path
