        time_zone:
          $ref: "#/components/schemas/TimeZone"
        window_start:
          $ref: "#/components/schemas/LocalTime"
        window_end:
          $ref: "#/components/schemas/LocalTime"
        carrier_reference:
          type:
            - string
            - "null"
        instructions:
          type:
            - string
            - "null"
        address:
